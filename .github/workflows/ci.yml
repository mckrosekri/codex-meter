name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - run: npm run check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test decision core
        shell: pwsh
        run: dotnet test windows/CodexDecision.Core.Tests/CodexDecision.Core.Tests.csproj --configuration Release -p:Platform=x64
      - name: Build Windows app
        shell: pwsh
        run: dotnet build windows/CodexMeterTray/CodexMeterTray.csproj --configuration Release -p:Platform=x64
      - name: Publish self-contained Windows app
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipInstaller
